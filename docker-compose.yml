services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: merchantflow
      POSTGRES_USER: merchantflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-merchantflow_dev}
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U merchantflow -d merchantflow']
      interval: 5s
      timeout: 3s
      retries: 10

  dev:
    build: .
    command: ['sleep', 'infinity']
    working_dir: /workspace
    ports:
      - '127.0.0.1:3000:3000'
      # Vite development server of apps/web (`pnpm dev:web`).
      - '127.0.0.1:5173:5173'
    # Docker Desktop exposes the socket as root:root with mode 0660, so the
    # unprivileged node user joins the root group to reach it.
    group_add:
      - '0'
    environment:
      PNPM_STORE_DIR: /pnpm/store
      # A server bound to the container's loopback is unreachable through a
      # published port, so the API and the Vite server listen on all interfaces
      # here.
      HOST: 0.0.0.0
      # Same credentials as the `postgres` service, reached by its service name
      # on the Compose network. A POSTGRES_PASSWORD with reserved URL characters
      # must be percent-encoded here.
      DATABASE_URL: postgresql://merchantflow:${POSTGRES_PASSWORD:-merchantflow_dev}@postgres:5432/merchantflow
      # Values come from the shell or the repository-root .env, which Compose
      # reads for interpolation; unset ones arrive empty and count as unset.
      # Recreate the container (docker compose up -d) after changing them.
      # Master key of the processor account secrets (see .env.example).
      CREDENTIALS_MASTER_KEY: ${CREDENTIALS_MASTER_KEY:-}
      # Stripe test keys of two sandboxes (A and B) for manual checks only;
      # the API never reads them.
      STRIPE_TEST_A_SECRET_KEY: ${STRIPE_TEST_A_SECRET_KEY:-}
      STRIPE_TEST_A_PUBLISHABLE_KEY: ${STRIPE_TEST_A_PUBLISHABLE_KEY:-}
      STRIPE_TEST_B_SECRET_KEY: ${STRIPE_TEST_B_SECRET_KEY:-}
      STRIPE_TEST_B_PUBLISHABLE_KEY: ${STRIPE_TEST_B_PUBLISHABLE_KEY:-}
      # Public base URL of the API, where Stripe delivers webhooks: the ngrok
      # dev domain with https://, only when NGROK_DOMAIN is set, so an empty
      # domain never becomes a bare "https://".
      PUBLIC_API_BASE_URL: ${NGROK_DOMAIN:+https://${NGROK_DOMAIN}}
    volumes:
      - .:/workspace
      - node-modules:/workspace/node_modules
      - pnpm-store:/pnpm/store
      # Lets Testcontainers start sibling containers. No TESTCONTAINERS_*
      # variables are needed on Docker Desktop: published ports are reached
      # through the Docker bridge gateway.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy

  # Optional public tunnel for Stripe webhooks in local work, started only with
  # `docker compose --profile webhooks up -d`. It forwards the account's
  # ngrok dev domain to the API in `dev` and applies the traffic policy that
  # lets through only POST requests to the webhook receiver. The local
  # inspection UI is published on the host's loopback only.
  ngrok:
    image: ngrok/ngrok:3.39.13-alpine
    profiles: ['webhooks']
    command:
      - http
      - dev:3000
      - --url=${NGROK_DOMAIN:-}
      - --traffic-policy-file=/etc/ngrok/traffic-policy.yml
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    volumes:
      - ./ngrok/traffic-policy.yml:/etc/ngrok/traffic-policy.yml:ro
    ports:
      - '127.0.0.1:4040:4040'
    depends_on:
      - dev

volumes:
  postgres-data:
  node-modules:
  pnpm-store:
