services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: merchantflow
      POSTGRES_USER: merchantflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-merchantflow_dev}
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U merchantflow -d merchantflow']
      interval: 5s
      timeout: 3s
      retries: 10

  dev:
    build: .
    command: ['sleep', 'infinity']
    working_dir: /workspace
    ports:
      - '127.0.0.1:3000:3000'
    # Docker Desktop exposes the socket as root:root with mode 0660, so the
    # unprivileged node user joins the root group to reach it.
    group_add:
      - '0'
    environment:
      PNPM_STORE_DIR: /pnpm/store
      # A server bound to the container's loopback is unreachable through a
      # published port, so the API must listen on all interfaces here.
      HOST: 0.0.0.0
      # Same credentials as the `postgres` service, reached by its service name
      # on the Compose network. A POSTGRES_PASSWORD with reserved URL characters
      # must be percent-encoded here.
      DATABASE_URL: postgresql://merchantflow:${POSTGRES_PASSWORD:-merchantflow_dev}@postgres:5432/merchantflow
    volumes:
      - .:/workspace
      - node-modules:/workspace/node_modules
      - pnpm-store:/pnpm/store
      # Lets Testcontainers start sibling containers. No TESTCONTAINERS_*
      # variables are needed on Docker Desktop: published ports are reached
      # through the Docker bridge gateway.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  node-modules:
  pnpm-store:
